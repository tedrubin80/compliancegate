[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-review-harness"
version = "0.1.0"
description = "Governance gap layer between AI-assisted coding, commit, and push"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "watchdog>=4.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]

[project.scripts]
crh = "compliance_harness.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["compliance_harness*"]
