[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compliancegate"
version = "0.1.0"
description = "ComplianceGate — governance gap layer between AI-assisted coding and ship (compliancegate.dev)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "watchdog>=4.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
langchain = [
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
]

[project.scripts]
compliancegate = "compliancegate.cli:main"
cg = "compliancegate.cli:main"

[project.urls]
Homepage = "https://compliancegate.dev"

[tool.setuptools.packages.find]
where = ["."]
include = ["compliancegate*"]
