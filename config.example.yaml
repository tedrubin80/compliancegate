# ComplianceGate — https://compliancegate.dev
# Copy to config.yaml and adjust for your environment.

project:
  name: "my-project"
  repo_root: "."

storage:
  # sqlite | markdown | remote | sqlite_markdown | all
  mode: sqlite_markdown
  sqlite_path: ".compliancegate/data/compliancegate.db"
  markdown_dir: ".compliancegate/reports"

llm:
  # provider: openai | openrouter | ollama
  provider: openai
  api_url: "https://api.openai.com/v1/chat/completions"
  api_key_env: "OPENAI_API_KEY"
  model: "gpt-4o-mini"
  ollama_url: "http://localhost:11434/api/chat"
  ollama_model: "llama3.2"
  timeout_seconds: 120
  redact_before_send: true
  json_mode: true

  # --- OpenRouter (unified model routing) ---
  # provider: openrouter
  # api_key_env: OPENROUTER_API_KEY
  # model: anthropic/claude-3.5-sonnet
  # fallback_models:
  #   - openai/gpt-4o-mini
  #   - google/gemini-2.0-flash-001
  # site_url: https://compliancegate.dev
  # app_title: ComplianceGate

# Optional two-stage LangChain pipeline: reasoning model → analytical model
# Requires: pip install 'compliancegate[langchain]'
langchain:
  enabled: false
  reasoning:
    model: anthropic/claude-3.5-sonnet   # best reasoning layer (OpenRouter id)
    temperature: 0.3
  analytical:
    model: openai/gpt-4o-mini            # best structured analytical layer
    temperature: 0.1

compliance:
  rule_packs:
    - base
  frameworks: []
  block_push_on: "high"
  block_commit_on: "critical"
  custom_rules: []

watch:
  enabled: true
  debounce_seconds: 3
  ignore_patterns:
    - "**/.git/**"
    - "**/node_modules/**"
    - "**/__pycache__/**"
    - "**/.compliancegate/**"
    - "**/venv/**"
    - "**/.venv/**"

reporting:
  session_markdown: true
  daily_markdown: true

retention:
  sync_on_review: false
  remote_payload: metadata_only
  sync_sensitive_findings: false
  postgres:
    enabled: false
    url_env: CG_POSTGRES_URL
  mysql:
    enabled: false
    url_env: CG_MYSQL_URL
