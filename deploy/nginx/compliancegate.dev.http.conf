# Temporary HTTP vhost for certbot + redirect prep
server {
    listen 80;
    listen [::]:80;
    server_name compliancegate.dev www.compliancegate.dev;

    root /var/www/compliance/site;
    index index.html;

    location /.well-known/acme-challenge/ {
        allow all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/www/compliance/logs/nginx-access.log;
    error_log /var/www/compliance/logs/nginx-error.log;
}
