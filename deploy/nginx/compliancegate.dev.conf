# ComplianceGate — compliancegate.dev

server {
    listen 80;
    listen [::]:80;
    server_name compliancegate.dev www.compliancegate.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/compliance/site;
        allow all;
    }

    location / {
        return 301 https://compliancegate.dev$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.compliancegate.dev;

    ssl_certificate /etc/letsencrypt/live/compliancegate.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/compliancegate.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://compliancegate.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name compliancegate.dev;

    root /var/www/compliance/site;
    index index.html;

    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/compliancegate.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/compliancegate.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/www/compliance/logs/nginx-access.log;
    error_log /var/www/compliance/logs/nginx-error.log;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|map)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
}
